# syntax: |
#  cli      // when cli and package have same names
#  cli,pkg  // when they differ

# installed with distro package manager
system:
  common: |
    zsh
    curl
    git
    zip
    unzip
    kitty
    pass
    jq
    rsync
    inotifywait,inotify-tools
  arch: |
    gpgconf,gnupg
    mise
    usage
  fedora: |
    gpgconf,gnupg2
  other: |
    gpgconf,gnupg

# installed with custom package manager (paru, brew)
custom:
  common: |
    fzf
    docker
    docker-compose
    lazydocker
    lazygit
    fd
    nvim,neovim
    rg,ripgrep
    wt,worktrunk
    fastfetch
    gitleaks
    bat
    eza
    zoxide
    glab
    tuicr
  arch: |
    docker-credential-pass
    gh,github-cli
    yq,go-yq
  other: &brew_packages |
    docker-credential-pass,docker-credential-helper
    gh
    yq
  fedora: *brew_packages

# installed with distro package manager for os with systemd
# Directly in Taskfile
# systemd:

# installed with custom package manager if file does not exist
files:
  common: []
  arch:
    - pkg: zsh-theme-powerlevel10k
      file: /usr/share/zsh-theme-powerlevel10k/powerlevel10k.zsh-theme
    - pkg: zsh-history-substring-search
      file: /usr/share/zsh/plugins/zsh-history-substring-search/zsh-history-substring-search.zsh
    - pkg: zsh-autosuggestions
      file: /usr/share/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh
  other: &brew_zsh_plugins
    - pkg: powerlevel10k
      file: $(brew --prefix)/share/powerlevel10k/powerlevel10k.zsh-theme
    - pkg: zsh-history-substring-search
      file: $(brew --prefix)/share/zsh-history-substring-search/zsh-history-substring-search.zsh
    - pkg: zsh-autosuggestions
      file: $(brew --prefix)/share/zsh-autosuggestions/zsh-autosuggestions.zsh
  fedora: *brew_zsh_plugins

sh:
  common:
  - pkg: getnf
    sh: curl -fsSL https://raw.githubusercontent.com/getnf/getnf/main/install.sh | bash
  - pkg: spf 
    sh: bash -c "$(curl -sLo- https://superfile.dev/install.sh)"
  arch: []
  other: &portable_shell_tools
    - pkg: mise
      sh: curl -fsSL https://mise.run | sh
    - pkg: usage
      sh: mise use -g usage
  fedora: *portable_shell_tools

# Optional system integrations, installed with the distro package manager.
wayland:
  common: |
    wl-copy,wl-clipboard
nas:
  common: |
    mount.cifs,cifs-utils

# installed with custom package manager
devops:
  common: |
    kubectl
    k9s
    helm
    stern
  sh:
    - cli: herdr
      sh: curl -fsSL https://herdr.dev/install.sh | sh

# helm-diff installed via helm, check Taskfile.

# installed with mise
dev:
  common: |
    python
    node
    go
  sh:
    - cli: hunk
      sh: curl -fsSL https://hunk.dev/install.sh | sh
    - cli: rustup
      sh: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh && rustup toolchain install stable

# AI coding agents installed via their official shell installers
ai:
  pi_packages:
    - git:github.com/huggingface/pi-llama
    - npm:pi-subagents
    - npm:pi-cc-status
    - npm:@pi-plugins/usage
    - npm:@gotgenes/pi-anthropic-auth
    - npm:pi-clear
  herdr_integrations:
    - claude
    - codex
    - pi
  sh:
    - cli: opencode
      pkg: OpenCode
      sh: curl -fsSL https://opencode.ai/install | bash
    - cli: codex
      pkg: Codex
      sh: sh -c 'curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh'
    - cli: claude
      pkg: Claude Code
      sh: sh -c 'curl -fsSL https://claude.ai/install.sh | bash'
    - cli: pi
      pkg: Pi
      sh: sh -c 'curl -fsSL https://pi.dev/install.sh | sh'
