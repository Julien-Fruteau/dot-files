# Installation metadata and the only supported customization surface.

[agent]
# Identity fields are roster metadata, not runtime overrides.
code = "bmad-dev-epic"
name = "BMad Dev Epic"
title = "Epic delivery orchestrator"
icon = "🛠️"
description = "Deliver every story of a BMad spec folder through bmad-build, with a verification gate and one attributed commit per story."
agent_type = "stateless"

activation_steps_prepend = []
activation_steps_append = []

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# Optional runtime model identifiers. Empty means: select the least expensive
# configured model adequate for the role; never invent an unavailable model ID.
coding_worker_model = ""
review_worker_model = ""
